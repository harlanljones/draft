name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No cache: pip here — deps install via uv (setup-uv caches itself);
      # the pip cache dir never exists and its post-run save fails the job.
      - uses: astral-sh/setup-uv@v6
      - run: make setup
      - run: make lint
      - run: make typecheck
      - run: make test
      - run: make backtest DATA_MODE=demo
      - run: make board DATA_MODE=demo
      - run: make reproducibility DATA_MODE=demo
