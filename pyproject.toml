[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "draft-prospect-model"
version = "0.1.0"
description = "Decision Regression for Amateur Future Talent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "numpy==2.5.2",
  "pydantic==2.13.4",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
college = [
  "ncaa-bbstats>=1.4.2",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pandas>=2.0",
]
empirical = [
  "ncaa-bbstats>=1.4.2",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pandas>=2.0",
]
dev = [
  "httpx2==2.13.0",
  "mypy==1.18.2",
  "pytest==8.4.2",
  "ruff==0.13.1",
]

[project.scripts]
draft-model = "draft_model.cli:main"
draft = "draft_model.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["draft_model"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
